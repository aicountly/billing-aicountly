# ---------------------------------------------------------------------------
# Deploy Billing to cPanel Sandbox  (https://billing.gh.aicountly.com)
#
# MANUAL ONLY. The single trigger is workflow_dispatch — merging or pushing
# never deploys. Add no push/pull_request/schedule triggers to this file.
#
# What it does: builds the app on the runner, then rsyncs the built dist/
# over SSH to the cPanel document root. No source, no node_modules, and no
# .env ever reach the server.
# ---------------------------------------------------------------------------
name: Deploy to cPanel Sandbox

on:
  workflow_dispatch:

# Never let two deploys to the same target overlap.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://billing.gh.aicountly.com

jobs:
  deploy:
    name: Build and deploy to Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Fail before doing any work if the deploy target is not fully
      # configured. Without this an unset secret would silently expand to an
      # empty string, and `rsync --delete` against "user@host:/" would target
      # the filesystem root instead of the document root.
      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.SANDBOX_SSH_HOST }}
          SSH_USER: ${{ secrets.SANDBOX_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SANDBOX_SSH_PRIVATE_KEY }}
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ]        || missing="$missing SANDBOX_SSH_HOST"
          [ -n "$SSH_USER" ]        || missing="$missing SANDBOX_SSH_USER"
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SANDBOX_SSH_PRIVATE_KEY"
          [ -n "$REMOTE_ROOT" ]     || missing="$missing SANDBOX_SSH_REMOTE_ROOT"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty required secret(s):$missing"
            exit 1
          fi

          # A relative remote root is normal on cPanel: rsync resolves it
          # against the SSH user's home directory, so "public_html" means
          # /home/<user>/public_html. Both forms are accepted.
          #
          # What must be refused is anything that resolves to the home
          # directory itself or climbs out of it, because the deploy runs with
          # --delete and would take the rest of the account with it.
          case "$REMOTE_ROOT" in
            ''|.|./|'~'|'~/')
              echo "::error::SANDBOX_SSH_REMOTE_ROOT points at the home directory itself, which --delete would wipe. Use the document root instead, e.g. public_html"
              exit 1
              ;;
            /|/home|/home/|/root|/var|/etc|/usr|/bin|/sbin|/boot|/opt)
              echo "::error::SANDBOX_SSH_REMOTE_ROOT is a system directory and is unsafe for a --delete deploy"
              exit 1
              ;;
            ..|../*|*/../*|*/..)
              echo "::error::SANDBOX_SSH_REMOTE_ROOT must not contain a parent-directory reference"
              exit 1
              ;;
          esac

          case "$REMOTE_ROOT" in
            /*) echo "Deploy target validated (absolute path)." ;;
            *)  echo "Deploy target validated ('$REMOTE_ROOT', relative to the SSH user's home directory)." ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        env:
          # Build-time config. Vite inlines VITE_* into the bundle, so these
          # are public values — never put a secret here.
          # Set SANDBOX_API_BASE_URL under Settings > Secrets and variables >
          # Actions > Variables. The placeholder fallback is deliberately
          # invalid so a missing variable fails loudly instead of silently
          # pointing the app at the wrong backend.
          VITE_API_BASE_URL: ${{ vars.SANDBOX_API_BASE_URL || 'https://REPLACE-ME.aicountly.com/api' }}
          VITE_APP_NAME: Billing
          VITE_APP_ENV: sandbox
        working-directory: web
        run: |
          if [ "$VITE_API_BASE_URL" = "https://REPLACE-ME.aicountly.com/api" ]; then
            echo "::warning::Repository variable SANDBOX_API_BASE_URL is not set; building against a placeholder API URL."
          fi
          npm run build

      - name: Verify build output
        run: |
          test -f web/dist/index.html || { echo "::error::web/dist/index.html missing — build produced no output"; exit 1; }
          test -f web/dist/.htaccess || echo "::warning::web/dist/.htaccess missing — SPA routes may 404 on refresh"
          # Belt and braces: a .env must never be shipped.
          if find web/dist -name '.env*' ! -name '.env.example' | grep -q .; then
            echo "::error::an .env file ended up in web/dist — refusing to deploy"
            exit 1
          fi
          if [ -d server-php ]; then
            if find server-php -name '.env' | grep -q .; then
              echo "::error::server-php contains a committed .env — refusing to deploy. The API .env belongs on the server only."
              exit 1
            fi
            echo "server-php present — it will be deployed to the api folder."
          else
            echo "::notice::No server-php directory in this repository; only the web build will be deployed."
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SANDBOX_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SANDBOX_SSH_HOST }}
          SSH_PORT: ${{ secrets.SANDBOX_SSH_PORT }}
          SSH_USER: ${{ secrets.SANDBOX_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # A truncated paste or CRLF line endings produce a key file that ssh
          # silently ignores, which then surfaces only as "Permission denied
          # (publickey)". Catch it here where the cause is still obvious.
          sed -i 's/\r$//' ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::SANDBOX_SSH_PRIVATE_KEY is not a usable OpenSSH private key. Copy the whole file, including the BEGIN and END lines."
            exit 1
          fi

          # Fingerprint and public key are not secret, and they are what you
          # compare against the server to confirm the right key is authorised.
          echo "Deploy key: $(ssh-keygen -l -f ~/.ssh/deploy_key)"
          echo "Public key that must appear in the cPanel user's ~/.ssh/authorized_keys:"
          sed 's/^/    /' ~/.ssh/deploy_key.pub

          # Pin the host key so deploys fail closed rather than trusting
          # whatever answers on that address.
          if ! ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "::error::ssh-keyscan could not reach the host on the configured port."
            sed 's/^/    /' /tmp/keyscan.err
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::The host returned no SSH host key. Check SANDBOX_SSH_HOST and SANDBOX_SSH_PORT."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

          # Older cPanel / CloudLinux hosts offer only RSA with SHA-1, which
          # OpenSSH 8.8+ (what the runner ships) refuses by default. Without
          # these two options such a server rejects a perfectly valid key with
          # exactly the same "Permission denied (publickey)" message.
          cat > ~/.ssh/config <<CFG
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port ${SSH_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            BatchMode yes
          CFG
          chmod 600 ~/.ssh/config

      # Authenticate before touching the document root, so a key problem is
      # reported as a key problem rather than as an rsync exit code.
      - name: Verify SSH authentication
        run: |
          if ssh deploy-target 'echo AICOUNTLY_SHELL_OK' > /tmp/ssh.out 2>/tmp/ssh.err; then
            # Exit code 0 is not proof the command ran. cPanel's noshell
            # accepts the connection, prints "Shell access is not enabled on
            # your account!", and exits 0 without executing anything — so the
            # sentinel, not the exit status, is what confirms a usable shell.
            if grep -q 'AICOUNTLY_SHELL_OK' /tmp/ssh.out; then
              echo "SSH authentication succeeded and the remote shell executes commands."
              exit 0
            fi

            echo "::error::SSH authenticated, but the server did not run the command. Shell access is disabled for this cPanel account, so rsync cannot run."
            echo "--- what the server said instead ---"
            sed 's/^/    /' /tmp/ssh.out
            [ -s /tmp/ssh.err ] && { echo "--- stderr ---"; sed 's/^/    /' /tmp/ssh.err; }
            cat <<'HINT'

          The deploy key is correct and authorised — authentication passed. The
          account's login shell is cPanel's "noshell", which prints that notice
          and exits. rsync runs as a command over SSH, so no SSH-based deploy
          can work until the account has a real shell.

          Nothing in this repository can change that. Fix it on the hosting
          account, in this order:

            1. With WHM access:
                 WHM > Account Functions > Manage Shell Access
                 > select the account > Jailed Shell

               Jailed Shell is the right choice: restricted, but it runs rsync.
               Normal Shell also works and grants more than a deploy needs.

            2. On shared hosting without WHM, ask the host to "enable jailed
               SSH shell access" for this account. That is the phrase to use;
               most hosts enable it on request for deployment.

            3. Verify it took effect, from any machine with the deploy key:

                 ssh -p <port> <user>@<host> 'echo ok; rsync --version | head -1'

               It must print "ok" followed by an rsync version. If the shell
               works but rsync is missing, ask the host to add rsync to the
               jail.

          The production and sandbox cPanel accounts are separate — each needs
          this enabled on its own.

          HINT
            exit 1
          fi

          echo "::error::SSH authentication to the cPanel host failed. The server refused the deploy key."
          echo "--- ssh output ---"
          sed 's/^/    /' /tmp/ssh.err

          # The server's half of the exchange is the only thing that separates
          # "key is not authorised" from "server cannot use this key type".
          # They produce an identical Permission denied without it.
          ssh -vvv deploy-target 'true' >/dev/null 2>/tmp/ssh.verbose || true

          echo "--- server version and key negotiation ---"
          grep -iE 'remote software version|remote protocol version|Offering public key|Server accepts key|send_pubkey_test|Authentications that can continue|no mutual signature|Unable to negotiate' \
            /tmp/ssh.verbose | sed 's/^/    /' || echo "    (no negotiation detail captured)"

          echo "--- host key types this server published ---"
          awk '{print $2}' ~/.ssh/known_hosts | sort -u | sed 's/^/    /'

          cat <<'HINT'

          Most common causes, in the order worth checking:

            1. The public key is not authorised for this cPanel user.
               cPanel imports and authorises as two separate actions: after
               importing, open SSH Access > Manage SSH Keys and click Manage,
               then Authorize. An imported-but-unauthorised key fails exactly
               like this.

            2. The server is too old to understand the key type. Look for the
               remote software version above: OpenSSH below 6.5 has no Ed25519
               support at all, so it ignores an Ed25519 key and reports this
               same error. Generate an RSA key instead (ssh-keygen -t rsa -b
               4096), authorise that, and store it in the secret. cPanel's own
               key generator defaults to RSA for this reason.

            3. The public key printed in the Configure SSH step does not match
               the one in the cPanel user's ~/.ssh/authorized_keys. Compare
               them character for character.

            4. SANDBOX_SSH_USER is not the cPanel account username.

            5. The private key stored in the secret belongs to a different key
               pair than the public key on the server.

            6. Permissions on the server: ~/.ssh must be 700 and
               ~/.ssh/authorized_keys 600, owned by the account. sshd silently
               refuses keys when these are too open.

          HINT
          exit 1

      # rsync speaks its binary protocol over the SSH connection's stdout, so
      # anything the account's shell prints there — a cPanel welcome banner, an
      # echo in ~/.bashrc — is injected into the front of that stream. rsync
      # then reads it where a version number belongs and dies with "protocol
      # version mismatch -- is your shell clean?", which names neither the file
      # nor the line responsible. Check it here, where the cause can be shown.
      #
      # The Verify SSH authentication step cannot catch this: it only echoes
      # text, so stray output passes straight through it unnoticed.
      - name: Check the remote shell is clean for rsync
        run: |
          ssh deploy-target 'true' > /tmp/remote-stdout 2>/tmp/remote-stderr || true

          # A disabled account shell announces itself on stdout too, but the
          # cure is completely different from a chatty .bashrc — so name it
          # separately instead of sending anyone hunting through dotfiles.
          if grep -qiE 'shell access is not enabled|shell access.*(disabled|not available)|contact support' /tmp/remote-stdout 2>/dev/null; then
            echo "::error::Shell access is disabled for this cPanel account, so rsync cannot run. See the Verify SSH authentication step for how to enable Jailed Shell."
            echo "--- what the server sent ---"
            sed 's/^/    /' /tmp/remote-stdout
            exit 1
          fi

          if [ -s /tmp/remote-stdout ]; then
            echo "::error::The remote shell writes to stdout on a non-interactive command, which corrupts the rsync protocol stream."
            echo "--- what the server sent on stdout ---"
            sed 's/^/    /' /tmp/remote-stdout
            echo "--- the same bytes (first 512) ---"
            head -c 512 /tmp/remote-stdout | od -c | sed 's/^/    /'
            cat <<'HINT'

          This is the cause of: rsync error: protocol incompatibility (code 2)
                                "protocol version mismatch -- is your shell clean?"

          Nothing in this repository can fix it — the output is produced on the
          server before rsync starts. Fix it on the cPanel account:

            1. Log in over SSH, or open cPanel File Manager with "Show hidden
               files" enabled, and look at these, in this order:

                   ~/.bashrc          (most common culprit)
                   ~/.bash_profile
                   ~/.profile

            2. Find the line producing the text shown above — usually an echo,
               printf, cat of a banner, fortune, or a version-manager init.

            3. Either delete it, or send it to stderr instead, which rsync
               ignores:

                   echo "welcome" >&2

               Better still, make the whole file silent unless the shell is
               interactive by putting this at the very top of ~/.bashrc, above
               anything that prints:

                   case $- in *i*) ;; *) return ;; esac

               Everything below it then runs only for real logins, and rsync
               gets a clean channel.

            4. Re-run this workflow. This step confirms the fix in seconds.

          A banner configured in sshd (the Banner directive) goes to stderr and
          is harmless — only stdout breaks rsync.

          HINT
            exit 1
          fi
          echo "Remote shell is clean: a non-interactive command produced no stdout."

          if [ -s /tmp/remote-stderr ]; then
            echo "::notice::The server writes to stderr on login. That is harmless for rsync; shown here for context:"
            sed 's/^/    /' /tmp/remote-stderr
          fi

          # A missing or very old rsync on the server reports the same protocol
          # error, so rule that out here rather than in the middle of a deploy.
          if ! ssh deploy-target 'command -v rsync' > /tmp/remote-rsync 2>/dev/null || [ ! -s /tmp/remote-rsync ]; then
            echo "::error::No rsync on the cPanel host. rsync must be installed there — ask the host to add it, since the deploy cannot run without it."
            exit 1
          fi
          echo "Remote rsync: $(cat /tmp/remote-rsync)"
          ssh deploy-target 'rsync --version 2>/dev/null | head -1' | sed 's/^/    /'

      # rsync creates the final directory of a destination path but never its
      # missing parents, so a wrong or not-yet-created document root surfaces
      # as `mkdir "..." failed: No such file or directory (2)` — with the path
      # masked in the log, since it comes from a secret. Check it here, where
      # the account's actual directories can be listed alongside the failure.
      - name: Check the deploy target exists on the server
        env:
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
        run: |
          set +e
          ssh deploy-target "REMOTE_ROOT='$REMOTE_ROOT' sh -s" > /tmp/target.out 2>&1 <<'REMOTE'
            if [ ! -d "$REMOTE_ROOT" ]; then echo "STATUS=MISSING"; exit 0; fi
            if [ ! -w "$REMOTE_ROOT" ]; then echo "STATUS=NOTWRITABLE"; exit 0; fi
            echo "STATUS=OK"
          REMOTE
          rc=$?
          set -e

          if [ $rc -ne 0 ]; then
            echo "::error::Could not check the deploy target over SSH."
            sed 's/^/    /' /tmp/target.out
            exit 1
          fi

          if grep -q 'STATUS=OK' /tmp/target.out; then
            echo "Deploy target exists on the server and is writable."
            exit 0
          fi

          if grep -q 'STATUS=NOTWRITABLE' /tmp/target.out; then
            echo "::error::The deploy target exists but the SSH user cannot write to it. Check the directory's owner and permissions in cPanel — it must be owned by the cPanel account."
            exit 1
          fi

          echo "::error::The deploy target directory does not exist on the server, so rsync cannot write into it."
          echo "--- directories in the account's home ---"
          ssh deploy-target 'echo "Home: $HOME"; ls -la "$HOME" 2>/dev/null | head -40' | sed 's/^/    /' || true
          echo "--- paths that look like document roots ---"
          ssh deploy-target 'ls -d "$HOME"/public_html "$HOME"/*/public_html "$HOME"/*billing* 2>/dev/null' | sed 's/^/    /' || echo "    (none found)"
          cat <<'HINT'

          rsync creates only the last directory of a destination path, never
          missing parent directories, which is why it failed with

              mkdir "..." failed: No such file or directory (2)

          Two causes, in order of likelihood:

            1. The domain has not been created in cPanel yet. cPanel creates
               the document root when the domain is added, and until then
               there is nothing to deploy into:

                 cPanel > Domains > Create A Domain

               Note the document root it reports and set the remote-root
               secret to exactly that path.

            2. The remote-root secret does not match the real document root.
               Compare the directories listed above against the value stored
               in the secret. A relative value resolves against the SSH user's
               home directory, so "public_html" means <home>/public_html.

          This workflow deliberately does not create the directory itself. On
          cPanel a document root only serves traffic when the domain that owns
          it exists, so creating the folder by hand would give a green deploy
          into a path no vhost serves — a site that still shows nothing.

          HINT
          exit 1

      - name: Deploy web build to the document root
        env:
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
        run: |
          # Connection settings come from ~/.ssh/config (host deploy-target),
          # written in the Configure SSH step.
          #
          # Trailing slash on web/dist/ copies the *contents* into REMOTE_ROOT.
          #
          # --delete keeps the docroot free of files removed from the build.
          # The excludes below protect paths that are not part of the web build
          # and must survive a deploy:
          #   api/         — the PHP backend lives inside the document root and
          #                  is deployed by the next step. Without this exclude
          #                  every web deploy would delete the entire API.
          #   .env         — server-side env file, if one is placed there
          #   .well-known/ — Let's Encrypt / AutoSSL validation; deleting it
          #                  breaks certificate renewal
          #   cgi-bin/     — cPanel-managed, present in every docroot
          #   .git*        — never publish repository metadata
          rsync -avz --delete \
            --exclude='api/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git*' \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            --chmod=D755,F644 \
            -e ssh \
            web/dist/ "deploy-target:$REMOTE_ROOT/"

      - name: Deploy server-php to the api folder
        if: hashFiles('server-php/**') != ''
        env:
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
        run: |
          # The API's .env is created once by hand on the server and read at
          # runtime on every request, unlike the web build. It must never be
          # uploaded and must never be deleted, hence the excludes below
          # combined with --delete.
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git*' \
            --chmod=D755,F644 \
            -e ssh \
            server-php/ "deploy-target:$REMOTE_ROOT/api/"

          echo "Deployed server-php to \$REMOTE_ROOT/api/"
          echo "::notice::If this is the first API deploy, create api/.env on the server with the database credentials — it is never uploaded."

      # Confirm the files actually landed, and that the deploy did not eat the
      # server-side .env. Checked over the same SSH connection the deploy used,
      # so this reflects the real state of the document root.
      - name: Verify files on the server
        env:
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
        run: |
          ssh deploy-target "REMOTE_ROOT='$REMOTE_ROOT' sh -s" <<'REMOTE'
            set -e
            cd "$REMOTE_ROOT" || { echo "::error::Remote root $REMOTE_ROOT does not exist"; exit 1; }

            [ -f index.html ] || { echo "::error::index.html is missing from the document root after deploy"; exit 1; }
            [ -d assets ]     || echo "::warning::no assets/ directory in the document root"
            [ -f .htaccess ]  || echo "::warning::.htaccess is missing — SPA routes may 404 on refresh"

            echo "Document root contents:"
            ls -la | sed 's/^/    /'

            # --exclude='.env' is what keeps this file alive across a --delete
            # deploy. Report it rather than failing: a brand-new site may not
            # have one yet, and the web build does not need it.
            if [ -f .env ]; then
              echo "Server-side .env is present and was preserved by the deploy."
            else
              echo "::notice::No .env in the document root. The React build does not need one (VITE_* values are compiled in)."
            fi
          REMOTE

      # End-to-end check that the deployed site actually answers over HTTPS.
      # Non-fatal: a brand-new portal may not have DNS or a certificate yet,
      # and that must not mark an otherwise successful file deploy as failed.
      - name: Health check the deployed site
        continue-on-error: true
        run: |
          echo "GET $SITE_URL"
          # curl still writes %{http_code} (as 000) when the request itself
          # fails, so swallow its exit status rather than appending a second
          # value — `|| echo 000` here would produce "000000".
          status=$(curl -sS -o /tmp/health.html -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 30 "$SITE_URL" || true)
          [ -n "$status" ] || status=000
          echo "HTTP status: $status"

          case "$status" in
            200)
              echo "Site responded 200 OK."
              grep -qi '<div id="root"' /tmp/health.html \
                && echo "Served page contains the app root element." \
                || echo "::warning::200 OK but the page does not look like the built app."
              ;;
            000)
              echo "::warning::Could not reach $SITE_URL — DNS, the vhost, or the certificate may not be set up yet. Files were deployed successfully."
              ;;
            *)
              echo "::warning::$SITE_URL returned HTTP $status. Files were deployed successfully; check the cPanel domain configuration."
              ;;
          esac

      - name: Clean up SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_key.pub ~/.ssh/config

      - name: Summary
        if: always()
        run: |
          {
            echo "### Sandbox deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Target | $SITE_URL |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
